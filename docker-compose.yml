services:
  db:
    image: postgres:16-alpine
    container_name: senha_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-senhas}
      POSTGRES_USER: ${POSTGRES_USER:-senhas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senhas_local_pw}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-senhas} -d ${POSTGRES_DB:-senhas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build: ./server
    container_name: senha_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-senhas}:${POSTGRES_PASSWORD:-senhas_local_pw}@db:5432/${POSTGRES_DB:-senhas}
      JWT_SECRET: ${JWT_SECRET:-troque_este_segredo_em_producao}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      TZ: ${TZ:-America/Sao_Paulo}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web:
    build: ./web
    container_name: senha_web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge
